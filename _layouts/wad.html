<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% if page.title and page.title != "blog" %}{{ page.title }} - {% endif %}blog - wheresallthedata</title>
<meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
<link rel="icon" href="/human-wad-88x31.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
{% feed_meta %}
<style>
/* Same sky, slab and type as the front page (index.html), minus the moving nebula. */
:root {
  color-scheme: dark;
  --void:   #000000;
  --deep:   #221569;
  --indigo: #3b2799;
  --violet: #a739e8;
  --pink:   #f465ee;
  --ice:    #b5e6ff;
  --sky:    #84d5fe;
  --ink:    #e9e4ff;
  --muted:  #a49bd1;
  --face-pixel: "Silkscreen", "Courier New", monospace;
  --face-body:  "Atkinson Hyperlegible", system-ui, sans-serif;
  --face-mono:  ui-monospace, Menlo, Consolas, monospace;
}
html, body { background: var(--void); color: var(--ink); }
body {
  margin: 0;
  font-family: var(--face-body);
  font-size: 17px;
  line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sky {
  position: fixed; inset: 0; z-index: 0;
  background: radial-gradient(ellipse at 60% 40%, var(--indigo), var(--deep) 35%, var(--void) 75%);
}
main { position: relative; z-index: 1; padding-top: 8vh; }

.back {
  margin: 0 auto 1.4rem; text-align: center;
  font-family: var(--face-pixel); font-size: 0.72rem; letter-spacing: 0.1em;
}
.back a { color: var(--sky); text-decoration: none; }
.back a:hover { color: var(--pink); }

/* the front page's ethos slab: a trapezoid, narrow at the top */
.ethos {
  --slant: clamp(18px, 6vw, 64px);
  --pad: clamp(24px, 5vw, 44px);
  position: relative;
  isolation: isolate;
  max-width: 62ch;
  margin: 0 auto 10vh;
  padding: calc(var(--pad) + 8px) calc(var(--pad) + var(--slant)) var(--pad);
}
.ethos::before, .ethos::after {
  content: "";
  position: absolute;
  z-index: -1;
  clip-path: polygon(var(--slant) 0, calc(100% - var(--slant)) 0, 100% 100%, 0 100%);
}
.ethos::before { inset: 0; background: var(--indigo); }
.ethos::after  { inset: 2px; background: rgba(0, 0, 0, 0.86); }
.label {
  font-family: var(--face-pixel);
  font-size: 0.72rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--pink);
  margin: 0 0 0.6rem;
}
.ethos h1, .ethos h2.list {
  font-family: var(--face-pixel);
  font-weight: 400;
  line-height: 1.25;
  color: var(--ice);
  text-wrap: balance;
}
.ethos h1 { font-size: clamp(1.3rem, 4vw, 1.8rem); margin: 0 0 1.2rem; }
.ethos h2.list {
  font-size: 0.85rem; letter-spacing: 0.08em;
  margin: 1.8rem 0 0.6rem; padding-top: 1.4rem;
  border-top: 2px dotted var(--indigo);
}
.ethos p { margin: 0 0 1rem; }
.ethos em { color: var(--sky); font-style: italic; }
.ethos a { color: var(--sky); text-underline-offset: 3px; }
.ethos a:hover { color: var(--pink); }
.ethos a:focus-visible { outline: 2px dashed var(--pink); outline-offset: 3px; }
.dim { color: var(--muted); }

.posts, .roll { list-style: none; margin: 0; padding: 0; }
.posts li, .roll li { margin: 0.45rem 0; }
.roll img { width: 16px; height: 16px; vertical-align: -2px; margin-right: 8px; image-rendering: pixelated; }

/* post text */
.ethos h2, .ethos h3 { font-family: var(--face-body); color: var(--ice); line-height: 1.3; margin: 2rem 0 0.6rem; }
.ethos h2 { font-size: 1.25rem; }
.ethos h3 { font-size: 1.05rem; }
.ethos img, .ethos video { max-width: 100%; height: auto; }
.ethos blockquote { margin: 0 0 1rem; padding-left: 14px; border-left: 2px solid var(--violet); color: var(--muted); }
.ethos code { font-family: var(--face-mono); font-size: 0.88em; color: var(--sky); }
.ethos pre { overflow-x: auto; margin: 0 0 1.2rem; padding: 12px 14px; background: rgba(34, 21, 105, 0.45); font-size: 0.85rem; }
.ethos pre code { color: var(--ink); }
.ethos hr { border: 0; border-top: 2px dotted var(--indigo); margin: 2rem 0; }

footer {
  position: relative; z-index: 1;
  text-align: center;
  font-family: var(--face-pixel);
  font-size: 0.62rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  padding-block: 0 6vh;
}
footer a { color: inherit; }
</style>

<div class="sky" aria-hidden="true"></div>
<main>
  <p class="back"><a href="/">&larr; wheresallthedata.fyi</a>{% if page.url != "/blog/" %} &nbsp; <a href="/blog/">blog</a>{% endif %}</p>
  <section class="ethos">
{{ content }}
  </section>
</main>
<footer>
  WAD = where's all the data // <a href="/blog/feed.xml">rss</a> // <a href="https://human.wheresallthedata.fyi">human.wad</a>
</footer>
</html>
