<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% if page.title %}{{ page.title }} // {% endif %}where's all the data?</title>
<meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
<link rel="icon" href="/human-wad-88x31.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Monsieur+La+Doulaise&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
{% feed_meta %}
<style>
/* same palette and faces as the front page */
:root {
  color-scheme: dark;
  --void:   #000000;
  --deep:   #221569;
  --indigo: #3b2799;
  --violet: #a739e8;
  --pink:   #f465ee;
  --ice:    #b5e6ff;
  --sky:    #84d5fe;
  --ink:    #e9e4ff;
  --muted:  #a49bd1;
  --face-hand:  "Monsieur La Doulaise", "Snell Roundhand", cursive;
  --face-pixel: "Silkscreen", "Courier New", monospace;
  --face-body:  "Atkinson Hyperlegible", system-ui, sans-serif;
  --face-mono:  ui-monospace, "Courier New", monospace;
}
html, body { margin: 0; background: var(--void); color: var(--ink); }
body {
  font: 18px/1.7 var(--face-body);
  background: radial-gradient(ellipse 120% 40rem at 50% -10rem, var(--deep), var(--void) 70%) no-repeat, var(--void);
}
.wrap { max-width: 68ch; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }

.top {
  display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 18px 0 0;
  font: 0.7rem/1.6 var(--face-pixel); letter-spacing: 0.1em; text-transform: uppercase;
}
.top a { color: var(--muted); text-decoration: none; }
.top a:hover, .top a[aria-current] { color: var(--sky); }

a { color: var(--sky); text-underline-offset: 3px; }
a:hover { color: var(--pink); }
a:focus-visible { outline: 2px dashed var(--pink); outline-offset: 3px; }

h1 {
  font: 400 clamp(3rem, 11vw, 5rem)/1.05 var(--face-hand);
  color: var(--ice); margin: 2.2rem 0 0.4rem;
  text-shadow: 0 0.04em 0 var(--deep), 0 0 0.6em rgba(167, 57, 232, 0.45);
}
.lede { color: var(--muted); margin: 0 0 2.4rem; }
h2.shelf {
  font: 0.78rem/1.4 var(--face-pixel); letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--pink); margin: 2.6rem 0 0.8rem; padding-bottom: 8px;
  border-bottom: 2px dotted var(--indigo);
}
.meta, .byline, time {
  font-family: var(--face-pixel); font-size: 0.68rem; letter-spacing: 0.08em; color: var(--muted);
}

/* the lists */
.posts, .roll { list-style: none; margin: 0; padding: 0; }
.posts li { display: grid; grid-template-columns: 7.2rem 1fr; gap: 2px 14px; padding: 10px 0; }
.posts li + li { border-top: 1px solid var(--deep); }
.posts time { padding-top: 0.35rem; }
.posts .title { font-weight: 700; }
.posts .byline { grid-column: 2; }
.roll li { display: flex; align-items: baseline; gap: 10px; padding: 5px 0; }
.roll img { width: 16px; height: 16px; flex: none; position: relative; top: 2px; image-rendering: pixelated; }
.roll .by { color: var(--muted); font-size: 0.85rem; }
.empty { color: var(--muted); font-style: italic; }
@media (max-width: 30rem) {
  .posts li { grid-template-columns: 1fr; }
  .posts .byline { grid-column: 1; }
}

/* a post */
.post h1 { margin-top: 0.6rem; }
.post .byline { margin: 0 0 2.4rem; }
.prose h2, .prose h3 { font-family: var(--face-body); color: var(--ice); line-height: 1.3; margin: 2.2rem 0 0.6rem; }
.prose h2 { font-size: 1.4rem; }
.prose h3 { font-size: 1.15rem; }
.prose p, .prose ul, .prose ol { margin: 0 0 1.1rem; }
.prose img, .prose video { max-width: 100%; height: auto; display: block; margin: 1.6rem auto; border: 2px solid var(--deep); }
.prose blockquote { margin: 0 0 1.1rem; padding-left: 16px; border-left: 3px solid var(--violet); color: var(--muted); }
.prose code { font-family: var(--face-mono); font-size: 0.88em; color: var(--sky); }
.prose pre {
  overflow-x: auto; margin: 0 0 1.3rem; padding: 14px 16px;
  background: rgba(34, 21, 105, 0.35); border-left: 2px dotted var(--indigo);
  font-size: 0.85rem; line-height: 1.55;
}
.prose pre code { color: var(--ink); }
.prose hr { border: 0; border-top: 2px dotted var(--indigo); margin: 2.4rem 0; }
.prose table { border-collapse: collapse; margin: 0 0 1.3rem; display: block; overflow-x: auto; }
.prose th, .prose td { border: 1px solid var(--deep); padding: 6px 10px; }

footer {
  margin: 5rem 0 0; padding: 18px 0 40px; border-top: 2px dotted var(--indigo);
  font: 0.62rem/1.8 var(--face-pixel); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
}
footer a { color: inherit; }
</style>

<div class="wrap">
  <nav class="top" aria-label="Site">
    <a href="/">wheresallthedata.fyi</a>
    <a href="/blog/"{% if page.url == "/blog/" %} aria-current="page"{% endif %}>blog</a>
    <a href="/blog/feed.xml">feed</a>
    <a href="https://human.wheresallthedata.fyi">human.wad</a>
  </nav>
  <main>
{{ content }}
  </main>
  <footer>
    human.wad // <a href="/blog/feed.xml">atom feed</a> // <a href="https://human.wheresallthedata.fyi">the webring</a>
  </footer>
</div>
</html>
